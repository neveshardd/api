# Integração e deploy contínuos do AGAGE Painel (Cloudflare Workers + D1).
#
# - Pull requests e pushes: lint, typecheck e testes.
# - Push na main: depois dos testes, build (OpenNext), migrations no D1 remoto e deploy.
#
# Secrets necessários no repositório (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   token da conta agage.eng (Workers, D1 e rotas da zona agage.com.br)
#   (opcionais) BETTER_AUTH_SECRET, RESEND_API_KEY, R2_*, TURNSTILE_SECRET_KEY: se presentes, são
#   enviados ao Worker; se ausentes, os já cadastrados no Worker são mantidos.
#   BETTER_AUTH_SECRET     segredo das sessões (aleatório, 32+ caracteres)
#   RESEND_API_KEY         envio de e-mails
#   R2_ACCESS_KEY_ID       token S3 do R2 (bucket agage-backoffice-media)
#   R2_SECRET_ACCESS_KEY
#   TURNSTILE_SECRET_KEY   chave secreta do widget Turnstile
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Nunca interromper um deploy/migration no meio.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, typecheck e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm test

  deploy:
    name: Migrations e deploy (Cloudflare)
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      # Sem token da Cloudflare, o deploy é pulado (com aviso) em vez de falhar: nesse caso os
      # deploys são feitos localmente com `npx wrangler deploy`.
      - name: Conferir token da Cloudflare
        id: token
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::CLOUDFLARE_API_TOKEN não cadastrado: deploy automático pulado."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.token.outputs.ok == 'true'
        uses: actions/checkout@v5
      - if: steps.token.outputs.ok == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - if: steps.token.outputs.ok == 'true'
        run: npm ci

      - name: Build (OpenNext para Cloudflare)
        if: steps.token.outputs.ok == 'true'
        run: npx opennextjs-cloudflare build

      # Antes do deploy: o código novo sempre encontra o schema já atualizado.
      - name: Migrations no D1 remoto
        if: steps.token.outputs.ok == 'true'
        run: npx wrangler d1 migrations apply DB --remote

      - name: Deploy com secrets
        if: steps.token.outputs.ok == 'true'
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: |
          # Arquivo temporário fora do repositório, só com os secrets preenchidos.
          SECRETS_FILE="$RUNNER_TEMP/worker-secrets.json"
          node -e '
            const names = ["BETTER_AUTH_SECRET","RESEND_API_KEY","R2_ACCESS_KEY_ID","R2_SECRET_ACCESS_KEY","TURNSTILE_SECRET_KEY"];
            const secrets = Object.fromEntries(names.filter((n) => process.env[n]).map((n) => [n, process.env[n]]));
            require("fs").writeFileSync(process.argv[1], JSON.stringify(secrets), { mode: 0o600 });
            console.log("Secrets enviados:", Object.keys(secrets).join(", "));
          ' "$SECRETS_FILE"
          # Secrets ausentes aqui são mantidos no Worker (o deploy só acrescenta/atualiza).
          npx wrangler deploy --secrets-file "$SECRETS_FILE"
          rm -f "$SECRETS_FILE"
